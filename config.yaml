faq:
  - question: Как отменить запись?
    answer: Откройте «Мои записи» и нажмите «Отменить». Позднюю отмену согласуйте с администратором.
  - question: Как оплатить?
    answer: Оплата на месте. Уточните доступные способы у администратора.
  - question: Что делать, если опаздываю?
    answer: Свяжитесь с нами по контактам из меню.
